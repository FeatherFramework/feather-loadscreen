name: Validate load screen

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check web/config.js
          node --check web/js/script.js

      - name: Test configuration and UI behavior
        run: |
          node --test tests/*.test.js

      - name: Test Lua lifecycle behavior
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          luac5.4 -p config.lua client/main.lua tests/lifecycle.lua
          lua5.4 tests/lifecycle.lua
